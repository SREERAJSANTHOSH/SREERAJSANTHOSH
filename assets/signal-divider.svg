<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-labelledby="title desc">
  <title id="title">Animated circuit signal divider</title>
  <desc id="desc">A subtle animated signal line for separating profile sections.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="0.82" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-200%" width="300%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M0 32H420L438 14H478L500 50H540L560 32H1200" fill="none" stroke="url(#line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 12">
    <animate attributeName="stroke-dashoffset" from="0" to="-210" dur="10s" repeatCount="indefinite"/>
  </path>
  <circle cy="32" r="3.2" fill="#67e8f9" filter="url(#glow)">
    <animate attributeName="cx" values="0;420;438;478;500;540;560;1200" keyTimes="0;0.35;0.37;0.41;0.43;0.47;0.49;1" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="32;32;14;14;50;50;32;32" keyTimes="0;0.35;0.37;0.41;0.43;0.47;0.49;1" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1;1;1;1;0" keyTimes="0;0.12;0.37;0.41;0.43;0.47;0.75;1" dur="6.5s" repeatCount="indefinite"/>
  </circle>
</svg>
