<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Sreeraj S - Electronics and Communication Engineer</title>
  <desc id="desc">A clean, minimal dark profile banner.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.4" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0V40H0" fill="none" stroke="#38bdf8" stroke-opacity="0.025" stroke-width="0.5"/>
    </pattern>
    <clipPath id="clip">
      <rect width="1200" height="280" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)" font-family="'Inter','Segoe UI',system-ui,Arial,sans-serif">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>
    <circle cx="300" cy="140" r="300" fill="url(#glow)"/>

    <!-- Minimal circuit traces -->
    <g stroke="#38bdf8" stroke-opacity="0.05" fill="none" stroke-width="0.8">
      <path d="M1100 40 L1100 100 L1060 100"/>
      <path d="M1100 180 L1100 240 L1060 240"/>
      <path d="M1060 100 L1060 240"/>
    </g>
    <circle cx="1100" cy="40" r="2" fill="#38bdf8" opacity="0.2"/>
    <circle cx="1060" cy="100" r="1.5" fill="#22d3ee" opacity="0.2"/>
    <circle cx="1060" cy="240" r="1.5" fill="#2dd4bf" opacity="0.2"/>

    <!-- Name & Title -->
    <g transform="translate(80 55)">
      <circle cx="4" cy="4" r="3" fill="#22d3ee" opacity="0.7"/>
      <text x="18" y="8" fill="#64748b" font-size="11" font-weight="700" letter-spacing="3">ELECTRONICS &amp; COMMUNICATION ENGINEER</text>

      <text x="0" y="82" fill="#f8fafc" font-size="60" font-weight="800" letter-spacing="-0.5">SREERAJ S</text>

      <rect x="2" y="98" width="60" height="3" rx="1.5" fill="url(#accent)"/>

      <text x="0" y="138" fill="#94a3b8" font-size="15" font-weight="500" letter-spacing="0.5">FPGA  ·  VHDL  ·  Embedded Systems  ·  PCB Design  ·  Python  ·  Networking</text>

      <!-- LinkedIn badge -->
      <g transform="translate(0 160)">
        <rect x="0" y="0" width="120" height="30" rx="6" fill="#0A66C2" fill-opacity="0.15" stroke="#0A66C2" stroke-opacity="0.3" stroke-width="1"/>
        <!-- LinkedIn "in" icon -->
        <rect x="12" y="7" width="3.5" height="15" rx="0.5" fill="#0A66C2"/>
        <circle cx="13.75" cy="9.5" r="2.2" fill="#0A66C2"/>
        <path d="M20 14c0-2.5 1.2-4 3.2-4 2 0 2.8 1.5 2.8 4v8h3.5v-8.5c0-4-2-6.5-5.2-6.5-2.2 0-3.5 1.2-4.3 2.5V7h-3.5v15H20v-8z" fill="#0A66C2"/>
        <text x="40" y="20" fill="#38bdf8" font-size="12" font-weight="600" letter-spacing="0.5">LinkedIn</text>
      </g>
    </g>

    <!-- Bottom line -->
    <rect x="0" y="277" width="1200" height="3" fill="url(#accent)" opacity="0.6"/>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="278.5" rx="19.25" fill="none" stroke="#7dd3fc" stroke-opacity="0.06" stroke-width="1.5"/>
</svg>
